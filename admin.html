<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOGS Admin Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#050b1f;--line:#1f4fd8;--blue:#1e6bff;--gold:#ffc83d;--txt:#eaf1ff;--mut:#8da2d6;--ok:#2ee06b;--bad:#ff4d5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Roboto,"Noto Sans Bengali",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:linear-gradient(160deg,#0f2250,#08122c);border:1.5px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 0 14px #1e6bff44}
.head{border-color:var(--gold);box-shadow:0 0 14px #ffc83d55;display:flex;align-items:center;gap:12px}
.head .cr{font-size:30px}.mut{color:var(--mut);font-size:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.item{padding:11px 4px;border-bottom:1px solid #16306f;cursor:pointer}.item:last-child{border:0}
.item:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#12275a;font-size:18px;flex:none}
.btn{border:0;border-radius:12px;padding:13px;font-weight:700;color:#fff;font-size:15px;width:100%;cursor:pointer;background:linear-gradient(180deg,#9a4dff,#5b21d6)}
.btn.sm{width:auto;padding:6px 14px;font-size:13px}.btn.ok{background:#16a34a}.btn.bad{background:#c4233a}.btn.gray{background:#24407f}
.btn:active{transform:scale(.97)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input{width:100%;background:#071331;border:1px solid #1f3b86;border-radius:10px;padding:10px;color:var(--txt);font-size:16px}
.sw{width:48px;height:26px;border-radius:14px;background:#24407f;position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:25px}
.tag{font-size:11px;border-radius:10px;padding:2px 8px;background:#14275c;color:var(--mut)}.tag.b{background:#4a1220;color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12275a;border:1px solid var(--blue);padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"><main id="m"></main></div>
<div class="toast" id="toast"></div>

<script>
const tg=window.Telegram&&window.Telegram.WebApp;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(!tg||!tg.initData){document.body.innerHTML='<p style="padding:40px 20px;text-align:center;font-family:sans-serif">Please open this from Telegram.</p>';throw new Error('Not in Telegram')}
tg.ready();tg.expand();
try{tg.setHeaderColor('#050b1f');tg.setBackgroundColor('#050b1f')}catch(e){}

const api=(p,m='GET',b)=>fetch('/api/admin'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'tma '+tg.initData},body:b?JSON.stringify(b):undefined})
  .then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error '+r.status);return d});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
const run=async f=>{try{await f()}catch(e){toast(e.message)}};

let D;
const load=async()=>{D=await api('/settings')};
const SEC={
 mining:['⚙','Mining Settings','Rate & Session',[['rate','Reward per hour (DOGS)','number'],['session','Session length (hours)','number'],['daily','Daily bonus (DOGS)','number']]],
 nft:['🐾','NFT Settings','Price & Boost'],
 deposit:['🅶','Deposit Settings','Address & Rate',[['address','Deposit address (TON wallet)','text'],['rate','1 TON = ? DOGS','number'],['min','Minimum deposit (TON)','number']]],
 tasks:['✅','Task Settings','Manage Tasks'],
 referral:['🏃','Referral Settings','Bonus & Milestone',[['bonus','Bonus per invite (DOGS)','number'],['every','Milestone every (invites)','number'],['reward','Milestone reward (DOGS)','number']]],
 users:['👥','Manage Users',''],
 wd:['⬆','Withdraw Requests',''],
 general:['⚙','General Settings','',[['bot','Bot link','text'],['support','Support link','text'],['maint','Maintenance mode','bool']]]
};

function home(){
  $('#m').innerHTML=`<div class="card head"><span class="cr">👑</span><div><b>Admin Panel</b><div class="mut">Control everything</div></div></div>
  <div class="card">${Object.entries(SEC).map(([k,v])=>`<div class="item row sp" tabindex="0" role="button" data-k="${k}"><div class="row"><div class="ico">${v[0]}</div><div><b>${v[1]}</b>${v[2]?`<div class="mut">(${v[2]})</div>`:''}</div></div>›</div>`).join('')}</div>`;
  $('#m').querySelectorAll('.item').forEach(e=>{e.onclick=()=>openSec(e.dataset.k);e.onkeydown=ev=>{if(ev.key==='Enter')openSec(e.dataset.k)}});
}
function shell(k,body){
  $('#m').innerHTML=`<div class="row"><button class="btn sm gray" id="back">‹ Back</button><b>${SEC[k][1]}</b></div><div class="card" id="body">${body}</div>`;
  $('#back').onclick=home;
}
function openSec(k){
  ({nft:nftScreen,tasks:tasksScreen,users:usersScreen,wd:wdScreen}[k]||(()=>form(k)))(k);
}

/* সাধারণ সেটিংস ফর্ম (mining, deposit, referral, general) */
function form(k){
  const f=SEC[k][3];
  shell(k,f.map(([key,lb,tp])=>tp==='bool'
    ?`<div class="row sp" style="margin-top:12px"><span>${lb}</span><button class="sw ${D[k][key]?'on':''}" data-key="${key}" aria-label="${lb}"></button></div>`
    :`<label for="f_${key}">${lb}</label><input id="f_${key}" type="${tp}" step="any" value="${esc(D[k][key])}">`).join('')
    +'<button class="btn" style="margin-top:16px" id="sv">Save Changes</button>');
  $('#body').querySelectorAll('.sw').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  $('#sv').onclick=()=>run(async()=>{
    const o={};
    for(const [key,,tp] of f){
      if(tp==='bool')o[key]=$('#body').querySelector(`.sw[data-key="${key}"]`).classList.contains('on');
      else if(tp==='number'){const v=parseFloat($('#f_'+key).value);if(!(v>=0))throw new Error('Enter valid numbers');o[key]=v}
      else o[key]=$('#f_'+key).value.trim();
    }
    D[k]=await api('/settings/'+k,'PUT',o);toast('Changes saved');
  });
}

/* NFT: প্রতিটির দাম ও বুস্ট */
function nftScreen(){
  shell('nft',D.nfts.map(n=>`<div class="item" style="cursor:default"><b>${esc(n.emoji)} ${esc(n.name)}</b><label for="p${n.id}">Price (DOGS)</label><input id="p${n.id}" type="number" step="any" value="${n.price}"><label for="b${n.id}">Boost (%)</label><input id="b${n.id}" type="number" step="any" value="${n.boost}"><button class="btn sm" style="margin-top:10px" data-id="${n.id}">Save</button></div>`).join(''));
  $('#body').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>run(async()=>{
    const id=b.dataset.id;
    await api('/nfts/'+id,'PUT',{price:parseFloat($('#p'+id).value),boost:parseFloat($('#b'+id).value)});
    await load();toast('Saved');
  }));
}

/* টাস্ক */
function tasksScreen(){
  shell('tasks',D.tasks.map(t=>`<div class="item row sp" style="cursor:default"><div><b>${esc(t.title)}</b><div class="mut">+${t.reward} DOGS${t.chat?' · verifies '+esc(t.chat):''}</div></div><button class="btn sm bad" data-d="${t.id}">Delete</button></div>`).join('')
    +`<label for="nt">New task title</label><input id="nt"><label for="nr">Reward (DOGS)</label><input id="nr" type="number" value="50"><label for="nc">Channel to verify (optional, e.g. @MyChannel)</label><input id="nc"><label for="nu">Link (optional, https://…)</label><input id="nu"><button class="btn" style="margin-top:14px" id="add">Add Task</button>`);
  $('#body').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>run(async()=>{await api('/tasks/'+b.dataset.d,'DELETE');await load();tasksScreen()}));
  $('#add').onclick=()=>run(async()=>{
    const title=$('#nt').value.trim(),reward=parseFloat($('#nr').value);
    if(!title||!(reward>=0))throw new Error('Enter title and reward');
    await api('/tasks','POST',{title,reward,chat:$('#nc').value.trim()||null,url:$('#nu').value.trim()||null});
    await load();tasksScreen();toast('Task added');
  });
}

/* ইউজার */
function usersScreen(){
  shell('users','<input id="q" placeholder="Search @username or ID" aria-label="Search users"><div id="ul" style="margin-top:8px"></div>');
  const draw=async()=>{
    const us=await api('/users?q='+encodeURIComponent($('#q').value));
    $('#ul').innerHTML=us.map(u=>`<div class="item row sp" style="cursor:default"><div><b>${esc(u.username?'@'+u.username:u.name||u.id)}</b> ${u.banned?'<span class="tag b">banned</span>':''}<div class="mut">ID ${u.id} · ${u.balance} DOGS</div></div><button class="btn sm ${u.banned?'ok':'bad'}" data-b="${u.id}" data-v="${u.banned?0:1}">${u.banned?'Unban':'Ban'}</button></div>`).join('')||'<p class="mut">No users.</p>';
    $('#ul').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>run(async()=>{await api('/users/'+b.dataset.b+'/ban','POST',{banned:b.dataset.v==='1'});await draw()}));
  };
  let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(()=>run(draw),300)};
  run(draw);
}

/* উইথড্র রিকোয়েস্ট */
function wdScreen(){run(async()=>{
  const w=await api('/withdrawals');
  shell('wd',`<label for="wm">Minimum withdraw (DOGS)</label><input id="wm" type="number" step="any" value="${D.withdraw.min}"><button class="btn sm" id="wms" style="margin:8px 0 14px">Save</button>`
    +(w.length?w.map(x=>`<div class="item" style="cursor:default"><div class="row sp"><b>${esc(x.username?'@'+x.username:x.user_id)}</b><b style="color:var(--gold)">${x.amount} DOGS</b></div><div class="mut" style="word-break:break-all">${esc(x.wallet)}</div><div class="row" style="margin-top:8px"><button class="btn sm ok" data-a="approve" data-i="${x.id}">Approve</button><button class="btn sm bad" data-a="reject" data-i="${x.id}">Reject</button></div></div>`).join(''):'<p class="mut">No pending requests.</p>'));
  $('#wms').onclick=()=>run(async()=>{const v=parseFloat($('#wm').value);if(!(v>=0))throw new Error('Enter a valid number');D.withdraw=await api('/settings/withdraw','PUT',{min:v});toast('Saved')});
  $('#body').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>run(async()=>{
    await api('/withdrawals/'+b.dataset.i,'POST',{action:b.dataset.a});
    toast(b.dataset.a==='approve'?'Approved — now send the TON manually':'Rejected, balance refunded');wdScreen();
  }));
})}

(async()=>{try{await load();home()}catch(e){$('#m').innerHTML=`<div class="card">${esc(e.message)}</div>`}})();

</script>
</body>
</html>
