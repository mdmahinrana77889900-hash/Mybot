<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet Mini App Template</title>
<style>
  :root {
    --bg: #08121f; --card: #10202f; --line: #1f3a52;
    --text: #e8f3fb; --muted: #7f9bb3; --gold: #4fd1c5; --gold-deep: #2b8fa8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; max-width: 480px; margin: 0 auto;
    padding: 20px 16px 96px; position: relative; overflow-x: hidden;
  }
  .globe {
    position: absolute; top: 40px; right: -90px; width: 360px; height: 360px;
    border-radius: 50%; z-index: -1; opacity: .75;
    background:
      radial-gradient(circle at 30% 70%, rgba(79,209,197,.35), transparent 40%),
      radial-gradient(circle, rgba(79,209,197,.55) 1px, transparent 1.5px) 0 0 / 9px 9px,
      radial-gradient(circle at 35% 30%, #1f5f73, #0a2330 70%);
    box-shadow: 0 0 80px rgba(43,143,168,.35), inset -40px -30px 80px rgba(0,0,0,.7);
    -webkit-mask: radial-gradient(circle, #000 55%, transparent 72%);
            mask: radial-gradient(circle, #000 55%, transparent 72%);
  }
  .brand { font-size: 28px; letter-spacing: 3px; font-weight: 600; }
  .brand i { color: var(--gold); font-style: normal; }
  svg.i { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .page { display: none; }
  .page.show { display: block; }

  .total { text-align: center; margin: 48px 0 20px; }
  .total small { color: var(--muted); font-size: 13px; letter-spacing: 1px; }
  .total .usd { font-size: 54px; font-weight: 500; margin: 10px 0 4px; }
  .total .usd span { font-size: 24px; color: var(--gold); margin-right: 4px; }
  .total .tkn { color: var(--muted); }
  .chip { display: inline-block; margin-top: 14px; padding: 8px 16px; background: rgba(16,32,47,.9); border-radius: 8px; font-size: 14px; }
  .chip b { color: #8fd18f; }

  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 28px 0; }
  .actions button {
    background: rgba(16,32,47,.92); border: 1px solid var(--line); color: var(--text);
    border-radius: 24px; padding: 16px 4px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .actions button svg { display: block; margin: 0 auto 8px; color: var(--gold); width: 30px; height: 30px; }
  .actions button:active { transform: scale(.96); }

  .boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .box {
    border: 1px solid var(--line); background: rgba(16,32,47,.92); color: var(--text);
    border-radius: 22px; padding: 18px; text-align: left; cursor: pointer; font: inherit;
  }
  .box.active { background: linear-gradient(135deg, #c9f5ef 0%, #5fd8cc 55%, var(--gold-deep) 100%); color: #0a2330; border-color: transparent; }
  .box .label { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .box .label svg { width: 22px; height: 22px; }
  .box .val { font-size: 28px; margin-top: 18px; }

  h2 { font-size: 20px; font-weight: 500; margin: 32px 0 12px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .logo {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #8ee6dc, var(--gold-deep));
    display: grid; place-items: center; font-weight: 700; color: #0a2330; font-size: 22px;
  }
  .row .info { flex: 1; }
  .row .info b { font-size: 20px; font-weight: 600; }
  .row small, .row .info div { color: var(--muted); font-size: 14px; }
  .row .amt { text-align: right; font-size: 20px; }

  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin-top: 16px; }
  .panel small { color: var(--muted); }

  nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(5, 1fr);
    background: #0c1824; border-top: 1px solid var(--line);
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .tab { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 4px; }
  .tab svg { display: block; margin: 0 auto 4px; }
  .tab.active { color: var(--text); }
  .tab.active svg { color: var(--gold); }
</style>
</head>
<body>
<div class="globe"></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="ic-receive" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="13" rx="3"/><path d="M3 10h18M12 13v6m-2.5-2.5L12 19l2.5-2.5"/></symbol>
  <symbol id="ic-send" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="13" rx="3"/><path d="M3 10h18M12 19v-6m-2.5 2.5L12 13l2.5 2.5"/></symbol>
  <symbol id="ic-swap" viewBox="0 0 24 24"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></symbol>
  <symbol id="ic-promo" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/></symbol>
  <symbol id="ic-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h13a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h-2"/></symbol>
  <symbol id="ic-cube" viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Zm0 9 8-4.5M12 12v9M12 12 4 7.5"/></symbol>
  <symbol id="ic-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-8Z"/></symbol>
  <symbol id="ic-act" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4m8-4v4M4 10h16"/></symbol>
  <symbol id="ic-chart" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 16v-4m3 4V8m3 8v-6"/></symbol>
  <symbol id="ic-node" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="m6 16 4-4 3 3 3-3 2 2"/></symbol>
  <symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></symbol>
</svg>

<div class="brand">YOURAPP<i>.</i></div>

<main id="p-home" class="page show">
  <section class="total">
    <small>মোট সম্পদ · USD</small>
    <div class="usd"><span>$</span><b id="usd">0.00</b></div>
    <div class="tkn">≈ <span id="tkn">0.00</span> TKN</div>
    <div class="chip">আজকের পুরস্কার <b>+0.00</b></div>
  </section>
  <section class="actions">
    <button><svg class="i"><use href="#ic-receive"/></svg>Receive</button>
    <button><svg class="i"><use href="#ic-send"/></svg>Transfer</button>
    <button><svg class="i"><use href="#ic-swap"/></svg>Flash Swap</button>
    <button><svg class="i"><use href="#ic-promo"/></svg>Promotion</button>
  </section>
  <section class="boxes">
    <button class="box active"><div class="label"><svg class="i"><use href="#ic-wallet"/></svg>Token Assets</div><div class="val" id="assets">$0.00</div></button>
    <button class="box"><div class="label"><svg class="i"><use href="#ic-cube"/></svg>Hold Node</div><div class="val">$0.00</div></button>
  </section>
  <h2>Tokens</h2>
  <div class="row">
    <div class="logo">T</div>
    <div class="info"><b>TKN</b><div>Your Token</div><div>≈ $<span id="price"></span></div></div>
    <div class="amt"><div id="amount"></div><small>≈ $<span id="worth"></span></small></div>
  </div>
</main>

<main id="p-activity" class="page"><h2>Activity</h2><div id="list"></div></main>

<main id="p-tkn" class="page"><h2>TKN</h2>
  <div class="panel">দাম: $<span id="p2"></span><br><small>এখানে চার্ট বা টোকেনের তথ্য দেখান</small></div>
</main>

<main id="p-node" class="page"><h2>Node</h2>
  <div class="panel">আপনার Node নেই।<br><small>এখানে Node কেনার অপশন দেখান</small></div>
</main>

<main id="p-my" class="page"><h2>My</h2>
  <div class="panel"><b>Guest</b></div>
</main>

<nav>
  <button class="tab active" data-p="p-home"><svg class="i"><use href="#ic-home"/></svg>Home</button>
  <button class="tab" data-p="p-activity"><svg class="i"><use href="#ic-act"/></svg>Activity</button>
  <button class="tab" data-p="p-tkn"><svg class="i"><use href="#ic-chart"/></svg>TKN</button>
  <button class="tab" data-p="p-node"><svg class="i"><use href="#ic-node"/></svg>Node</button>
  <button class="tab" data-p="p-my"><svg class="i"><use href="#ic-user"/></svg>My</button>
</nav>

<script>
  const $ = id => document.getElementById(id);
  const data = {
    tokens: 120, price: 0.1,
    history: [{t: 'Receive', a: '+120 TKN', d: 'আজ'}]
  };
  const usd = data.tokens * data.price;
  $('usd').textContent = usd.toFixed(2);
  $('tkn').textContent = data.tokens.toFixed(2);
  $('assets').textContent = '$' + usd.toFixed(2);
  $('price').textContent = data.price.toFixed(5);
  $('p2').textContent = data.price.toFixed(5);
  $('amount').textContent = data.tokens;
  $('worth').textContent = usd.toFixed(4);
  $('list').innerHTML = data.history.length
    ? data.history.map(h => `<div class="row"><div class="info"><b style="font-size:17px">${h.t}</b><div>${h.d}</div></div><div class="amt">${h.a}</div></div>`).join('')
    : '<div class="empty">এখনো কোনো লেনদেন নেই</div>';

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x => x.classList.remove('show'));
    t.classList.add('active');
    $(t.dataset.p).classList.add('show');
    scrollTo(0, 0);
  }));
</script>
</body>
</html>
